 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><div><h2>Tus ventanas</h2><p>Accede a las herramientas de administración.</p></div></div><div class="accesses"><a class="access" href="../02_parametros_tema/index.html"><span class="symbol"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span><div><b>Parámetros y tema</b><p>Personaliza la imagen corporativa y los parámetros del sistema.</p></div><span class="arrow">›</span></a><a class="access" href="../03_auditoria/index.html"><span class="symbol"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h6"/></svg></span><div><b>Auditoría</b><p>Consulta quién hizo cada acción y cuándo.</p></div><span class="arrow">›</span></a><a class="access" href="../04_logs_errores/index.html"><span class="symbol"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m10.3 3.9-8.2 14a2 2 0 0 0 1.7 3h16.4a2 2 0 0 0 1.7-3l-8.2-14a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></span><div><b>Logs de errores</b><p>Revisa los errores registrados por los servicios.</p></div><span class="arrow">›</span></a><a class="access" href="../05_usuarios/index.html"><span class="symbol"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.1a4 4 0 0 1 0 7.8M22 21a7 7 0 0 0-5-6.7"/></svg></span><div><b>Usuarios</b><p>Registra usuarios y asigna su rol y sucursal.</p></div><span class="arrow">›</span></a><a class="access" href="../06_destinatarios/index.html"><span class="symbol"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span><div><b>Destinatarios</b><p>Administra los correos que reciben las alertas de stock bajo.</p></div><span class="arrow">›</span></a></div></section></main></div></template><script>
const estado=new URLSearchParams(location.search).get('estado')||'principal';
function go(s){location.search='?estado='+s}
function closeModal(){document.querySelectorAll('.shade').forEach(e=>e.classList.remove('open'))}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.querySelector('.sidebar')?.classList.remove('visible')}});
function password(b){const i=document.querySelector('#password');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Mostrar':'Ocultar'}
function audit(){let a=document.querySelector('#desde').value,b=document.querySelector('#hasta').value;go(!a||!b?'fechas_obligatorias':a>b?'fechas_invertidas':'principal')}
function register(){let e=document.querySelector('#email').value,p=document.querySelector('#password').value;if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))go('correo_invalido');else if(p.length<8||!/[A-Z]/.test(p)||!/[0-9]/.test(p))go('contrasena_invalida');else go(e==='sofia.ramirez@konradgourmet.com'?'correo_duplicado':'registrado')}
function corporate(){const c=document.querySelector('#colorhex').value;const f=document.querySelector('#logo').files[0];if(!/^#[0-9a-f]{6}$/i.test(c))go('color_invalido');else if(f&&(!['image/png','image/jpeg','image/svg+xml','image/webp'].includes(f.type)||f.size>204800))go('logo_invalido');else go('imagen_guardada')}
function parameter(){let k=document.querySelector('#clave').value,v=document.querySelector('#valor').value;go(!k.trim()?'clave_obligatoria':!v.trim()?'valor_obligatorio':!/^[a-z0-9.-]+$/.test(k)?'clave_invalida':'parametro_guardado')}
function recipient(){let e=document.querySelector('#destcorreo').value;go(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)?'principal':'correo_invalido')}
</script><script>document.querySelector('#screen').innerHTML=(document.getElementById('state-'+estado)||document.getElementById('state-principal')).innerHTML;
if(document.body.classList.contains('page-04_logs_errores'))document.querySelector('#servicio').value=estado==='principal'?'ms-notificaciones':'Todos';
if(document.body.classList.contains('page-06_destinatarios'))document.querySelector('#sucursal').addEventListener('change',e=>{let t=document.querySelectorAll('#screen .card h2')[1];t.textContent='Destinatarios de la Sucursal '+e.target.value;document.querySelectorAll('#screen .card')[1].querySelector('.table-wrap,.empty').outerHTML='<div class="empty">Esta sucursal todavía no tiene destinatarios: nadie recibiría sus alertas.</div>'});
if(document.querySelector('#ordenar'))document.querySelector('#ordenar').addEventListener('change',e=>{const tb=document.querySelector('#screen tbody');const col={'Diferencia':5,'Valor total':4,'Número':0}[e.target.value];const val=r=>parseFloat(r.cells[col].textContent.replace(/[^0-9,−-]/g,'').replace('−','-').replace(',','.'))||0;[...tb.rows].sort((a,b)=>val(a)-val(b)).forEach(r=>tb.appendChild(r))});
</script></body></html>
