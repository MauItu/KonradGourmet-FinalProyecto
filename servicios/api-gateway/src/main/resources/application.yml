server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Llave pública de ms-identidad (DEC-62). Se lee la primera vez que llega un token.
          jwk-set-uri: ${JWKS_URL:http://ms-identidad:8080/api/auth/jwks}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  cloud:
    loadbalancer:
      cache:
        # Por omisión la lista de instancias se guarda 35 s: en local se acorta para que un
        # servicio recién levantado reciba tráfico enseguida.
        ttl: 5s
    gateway:
      server:
        webflux:
          # El gateway limita la tasa (página 3a, DEC-104): cada usuario (o cada IP sin sesión) tiene un balde de
          # tokens en Redis que se llena a LIMITE_TASA por segundo y admite ráfagas de LIMITE_RAFAGA; pasado el
          # límite responde 429 Too Many Requests.
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@claveLimiteTasa}"
                redis-rate-limiter.replenishRate: ${LIMITE_TASA:100}
                redis-rate-limiter.burstCapacity: ${LIMITE_RAFAGA:200}
                redis-rate-limiter.requestedTokens: 1
          # Los 13 prefijos de la tabla 5 del reporte. lb:// resuelve la instancia en Eureka.
          routes:
            - id: identidad-auth
              uri: lb://ms-identidad
              predicates:
                - Path=/api/auth,/api/auth/**
            - id: identidad-usuarios
              uri: lb://ms-identidad
              predicates:
                - Path=/api/usuarios,/api/usuarios/**
            - id: pedidos-pedidos
              uri: lb://ms-pedidos
              predicates:
                - Path=/api/pedidos,/api/pedidos/**
            - id: menu-platos
              uri: lb://ms-menu
              predicates:
                - Path=/api/platos,/api/platos/**
            - id: inventario-inventario
              uri: lb://ms-inventario
              predicates:
                - Path=/api/inventario,/api/inventario/**
            - id: solicitudes-solicitudes
              uri: lb://ms-solicitudes
              predicates:
                - Path=/api/solicitudes,/api/solicitudes/**
            - id: cotizaciones-cotizaciones
              uri: lb://ms-cotizaciones
              predicates:
                - Path=/api/cotizaciones,/api/cotizaciones/**
            - id: cotizaciones-proveedores
              uri: lb://ms-cotizaciones
              predicates:
                - Path=/api/proveedores,/api/proveedores/**
            - id: ordenes-ordenes-compra
              uri: lb://ms-ordenes
              predicates:
                - Path=/api/ordenes-compra,/api/ordenes-compra/**
            - id: administracion-admin
              uri: lb://ms-administracion
              predicates:
                - Path=/api/admin,/api/admin/**
            - id: analitica-bam
              uri: lb://ms-analitica
              predicates:
                - Path=/api/bam,/api/bam/**
            - id: notificaciones-notificaciones
              uri: lb://ms-notificaciones
              predicates:
                - Path=/api/notificaciones,/api/notificaciones/**
            - id: integracion-integracion
              uri: lb://ms-integracion
              predicates:
                - Path=/api/integracion,/api/integracion/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://service-registry:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
