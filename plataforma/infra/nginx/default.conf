# Servidor web de la SPA (página 3a): entrega los archivos estáticos y pasa /api/** al API Gateway,
# así la SPA y la API comparten origen y no hace falta CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estado de la plataforma (solo en local): instancias en Eureka y rutas del gateway.
    location = /plataforma/registro {
        proxy_pass http://service-registry:8761/eureka/apps;
        proxy_set_header Accept application/json;
    }
    location = /plataforma/rutas {
        proxy_pass http://api-gateway:8080/actuator/gateway/routes;
    }

    # Rutas de la SPA (React Router): cualquier ruta que no sea un archivo devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
