server:
  port: 8080

spring:
  application:
    name: ms-cotizaciones
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/ms_cotizaciones
    username: ms_cotizaciones
    password: ms_cotizaciones
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # el relé de la outbox espera cada lote: si Kafka no responde, falla en 10 s y lo reintenta (DEC-104, C7-21)
      properties:
        max.block.ms: 10000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      # orden.generada (corte 5): un grupo por servicio y, la primera vez, desde el principio del tópico.
      group-id: ms-cotizaciones
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://service-registry:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info

konrad:
  # Almacén de objetos S3 compatible (SeaweedFS en local, DEC-59): el PDF de cada cotización.
  s3:
    endpoint: ${S3_URL:http://s3:8333}
    usuario: konrad
    clave: konrad-secreto
    bucket-documentos: documentos-pdf
  # REST interno de precios de ms-integracion (PrecioRestController, fuera del gateway). El nombre es el
  # de Eureka: el balanceador escoge la instancia.
  integracion:
    url: http://ms-integracion
    espera-ms: 5000
