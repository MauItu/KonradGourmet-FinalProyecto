server:
  port: 8080

spring:
  application:
    name: ms-solicitudes
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/ms_solicitudes
    username: ms_solicitudes
    password: ms_solicitudes
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      # cotizacion.enviada y orden.generada: un grupo por servicio y, la primera vez, desde el principio
      # del tópico.
      group-id: ms-solicitudes
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://service-registry:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
