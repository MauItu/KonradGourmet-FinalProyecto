server:
  port: 8080

spring:
  application:
    name: ms-analitica
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/ms_analitica
    username: ms_analitica
    password: ms_analitica
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      # La primera vez lee los tópicos desde el principio: los hechos de todo lo que ya pasó y la carta (menu.actualizado).
      group-id: ms-analitica
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://service-registry:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info

konrad:
  analitica:
    # TendenciasJob (PD-04): cada semana, el lunes a las 6:00 de Bogotá; en el compose local, cada 30 s (TENDENCIAS).
    tendencias: ${TENDENCIAS:0 0 6 * * MON}
    # La API de tendencias de la red social (supuesto S11) y su token de acceso; en local, WireMock.
    redes:
      url: ${REDES_URL:https://api.redes-sociales.example/v1/tendencias}
      token: ${REDES_TOKEN:}
